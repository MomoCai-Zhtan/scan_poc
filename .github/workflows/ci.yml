name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install opencv-python-headless numpy flask httpx

      - name: Run backend tests
        run: |
          python ocr_cli/test_inherit.py
          python scan_entry/test_flow.py
          python scan_entry/test_export.py
          python ocr_cli/test_app_load.py

      - name: Run frontend verification
        run: |
          python scan_entry/verify_html.py
          python scan_entry/verify_js_braces.py

      - name: Check JS syntax
        run: node --check scan_entry/templates/index.html || true

  baseline:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy flask httpx

      - name: Run baseline verification
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python ocr_cli/verify_baseline.py --all --json --threshold 75 > baseline.json || true
          echo "BASELINE_EXIT=$?" >> $GITHUB_ENV

      - name: Generate accuracy map
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python ocr_cli/accuracy_map.py --save || true

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report-${{ github.sha }}
          path: |
            debug/baseline_*.md
            baseline.json

      - name: Comment baseline results
        if: always()
        run: |
          if [ -f baseline.json ]; then
            cat baseline.json
          fi
