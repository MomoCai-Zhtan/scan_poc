<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>離心製管掃描輸入工具</title>
<link rel="stylesheet" href="/static/style.css">
<script>
// Cache buster: reload if server restarted
const TS = {{ _ts }};
if (window._ts && window._ts !== TS) location.reload();
window._ts = TS;

const PDFS = {{ pdfs | tojson }};
const HEADER = {{ header | tojson }};
const ITEM_COUNT = {{ item_count | tojson }};
</script>
</head>
<body>
<header>
  <h1>離心製管掃描輸入</h1>
  <div class="header-nav">
    <label>掃描檔:</label>
    <span id="pdfGroup"></span>
    <label class="file-btn">
      上傳 PDF
      <input type="file" id="pdfUpload" accept=".pdf" style="display:none">
    </label>
    <span id="pageNav" style="display:none">
      <button id="btnPrev" class="nav-btn">上一頁</button>
      <span id="pageInfo"></span>
      <button id="btnNext" class="nav-btn">下一頁</button>
    </span>
    <span id="dateInfo"></span>
    <span id="msg" class="msg" style="display:none"></span>
    <span id="collInfo" class="badge" style="display:none">已收集: 0</span>
    <button id="btnExport" class="primary">匯出 CSV</button>
    <a href="/selector" class="nav-btn">欄位選擇器</a>
    <a href="/admin" class="nav-btn">管理</a>
  </div>
</header>
<main id="main">
  <div id="emptyState" class="empty-state">請選擇上方 PDF 開始審查</div>
  <div id="layoutBody" class="layout-body" style="display:none">
    <div class="band-list">
      <h4>番次列表</h4>
      <div id="bandList"></div>
    </div>
    <div class="layout-row">
      <div class="canvas-col">
        <div class="canvas-wrap">
          <div class="canvas-toolbar">
            <span class="toolbar-drag" title="拖曳移動">⠿</span>
            <label><input type="checkbox" id="gridToggle" checked> 顯示欄位編號</label>
            <button id="btnReOcr" class="toolbar-btn" title="強制重新 OCR 目前頁並更新快照">重新 OCR</button>
          </div>
          <canvas id="scanCanvas"></canvas>
          <div class="legend">藍色<span class="lg-cur"></span>目前番次&nbsp;&nbsp;綠色<span class="lg-col"></span>已收集</div>
        </div>
      </div>
      <div class="form-col">
        <div id="pageStatus" class="page-status"></div>
        <div class="stage-progress">
          <button id="btnStagePrev" class="nav-btn">上一步</button>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
          <span id="stageLabel"></span>
          <button id="btnStageNext" class="nav-btn">下一步</button>
        </div>
        <div id="stageForm"></div>
         <div class="form-actions">
           <button id="btnAddBand" class="primary">加入集合 (Enter)</button>
           <button id="btnResetBand">重置此番</button>
           <button id="btnReOcrBand" class="nav-btn">重新辨識此番</button>
         </div>
        <div class="shortcut-hint">
          快捷鍵: Enter=下一步/收集 · 1/2/3=切階段 · ←/→=切換番次 · Esc=清除欄位
        </div>
      </div>
    </div>
  </div>
</main>
<div id="loading" class="loading" style="display:none">
  <div class="spinner"></div>
  <span>處理中...</span>
</div>

<script src="/static/app.js"></script>
</body>
</html>
