<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>離心製管掃描輸入工具</title>
<style>
  :root { --line:#ccc; --head:#f0f0f0; --sel:rgba(66,133,244,.25); }
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; background: #fafafa; color: #222; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 16px; position: sticky; top: 0; z-index: 10;
           display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  header select, header button, header input { font-size: 14px; padding: 6px 10px; }
  button { cursor: pointer; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  button.primary { background: #4285f4; color: #fff; border-color: #4285f4; }
  .file-btn { display: inline-block; padding: 6px 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 14px; }
  .file-btn:hover { background: #f5f5f5; }
  .pdf-btn { padding: 5px 10px; margin: 2px; background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 13px; }
  .pdf-btn:hover { background: #f5f5f5; }
  .pdf-btn.on { background: #4285f4; color: #fff; border-color: #4285f4; }
  .nav-btn { padding: 5px 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 13px; }
  .nav-btn:hover { background: #f5f5f5; }
  .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .page-body { display: flex; gap: 12px; padding: 12px; }
  .scan-col { flex: 0 0 auto; max-width: 700px; }
  .table-col { flex: 1 1 auto; overflow-x: auto; }
  main { padding: 16px; }
  .page { background: #fff; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
  .page-head { display: flex; gap: 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line);
               background: var(--head); flex-wrap: wrap; }
  .page-head h3 { margin: 0; font-size: 15px; }
  .badge { background: #4285f4; color: #fff; border-radius: 3px; padding: 2px 8px; font-size: 13px; }
  .page-body { display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
  canvas { max-width: 640px; width: 100%; height: auto; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; max-width: 300px; }
  .chip { min-width: 30px; text-align: center; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px;
          cursor: pointer; font-size: 13px; user-select: none; }
  .chip.on { background: #4285f4; color: #fff; }
  .table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  table.grid { border-collapse: collapse; white-space: nowrap; font-size: 13px; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 2px 4px; }
  table.grid thead tr.group th { background: #e8f0fe; font-size: 12px; color: #444; }
  table.grid thead tr.cols th { background: var(--head); }
  table.grid td.auto { background: #fbfbfb; }
  table.grid input { width: 62px; border: 1px solid transparent; padding: 3px; font-size: 13px; }
  table.grid input:focus { border-color: #4285f4; outline: none; background: #fff; }
  table.grid input.auto-fill { background: #e8f5e9; }
  table.grid input.auto-warn { background: #fef9e7; border-color: #f0ad4e !important; }
  table.grid td.copytd { text-align: center; }
  .msg { padding: 8px 14px; border-radius: 4px; margin: 10px 0; }
  .msg.ok { background: #e6f4ea; color: #1e7e34; }
  .msg.err { background: #fce8e6; color: #c5221f; }
  .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #4285f4; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>離心製管掃描輸入</h1>
  <label>掃描檔:</label>
  <span id="pdfGroup"></span>
  <label class="file-btn">
    上傳 PDF
    <input type="file" id="pdfUpload" accept=".pdf" style="display:none">
  </label>
  <span id="pageNav" style="display:none">
    <button id="btnPrev" class="nav-btn">上一頁</button>
    <span id="pageInfo"></span>
    <button id="btnNext" class="nav-btn">下一頁</button>
  </span>
  <span id="dateInfo"></span>
  <span id="msg" class="msg" style="display:none"></span>
  <button id="btnAdd" class="primary" style="display:none">加入集合</button>
  <button id="btnExport" class="primary">匯出 CSV</button>
  <span id="collInfo" class="badge" style="display:none;background:#f0ad4e">集合: 0</span>
  <div id="loading" class="loading" style="display:none">
    <div class="spinner"></div>
    <span>處理中...</span>
  </div>
</header>
<main id="main"></main>

<script>
// Cache buster: reload if server restarted
const TS = {{ _ts }};
if (window._ts && window._ts !== TS) location.reload();
window._ts = TS;

const PDFS = {{ pdfs | tojson }};
const HEADER = {{ header | tojson }};
const ITEM_COUNT = {{ item_count | tojson }};
const GROUPS = [
  {label:"基本", cols:["序","品項","生產數量(支數)","生產量修正(+/-量)","位置"]},
  {label:"轉位", cols:["轉位1","轉位2","轉位3","轉位4","轉位5","轉位6"]},
  {label:"離心", cols:["離心開始","離心結束","加料轉速","慢速轉速","中速轉速","高速轉速","加料時間","慢速時間","中速時間","高速時間"]},
  {label:"蒸養", cols:["蒸養池","入池時間","蒸養溫度1","蒸養溫度2","蒸養溫度3","蒸養階段1","蒸養階段2","蒸養階段3"]},
  {label:"排列", cols:["排列1","排列2","排列3","排列4","排列5","排列6"]},
];
const AUTOS = ["日期","類型","番數","時段"];

let analysisData = null;
let pdfName = "";
let currentPage = 1;
let totalPages = 0;
let selections = {};   // page -> Set(bandIndex)
let dups = {};         // "page:band" -> 額外重複列數
const pageImages = {}; // page -> HTMLImageElement
let collectionCount = 0;

function $(id){ return document.getElementById(id); }

function showMsg(text, ok){
  const m = $("msg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
  m.style.display = "";
}

function showLoading(text){
  const el = $("loading");
  if (el) {
    el.querySelector("span").textContent = text || "處理中...";
    el.style.display = "";
  }
}

function hideLoading(){
  const el = $("loading");
  if (el) el.style.display = "none";
}

function loadPdfs(){
  const group = $("pdfGroup");
  group.innerHTML = "";
  PDFS.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "pdf-btn";
    btn.textContent = p;
    btn.onclick = () => openPdf(p, btn);
    group.appendChild(btn);
  });
  if (PdfS.length) openPdf(PdfS[0], group.children[0]);
  $("pdfUpload").onchange = (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const form = new FormData();
    form.append('file', file);
    showLoading("上傳中...");
    fetch("/upload", { method: "POST", body: form })
      .then(r => r.json())
      .then(data => {
        if (data.ok){
          showMsg("上傳成功: " + data.name, true);
          location.reload();
        } else {
          showMsg("上傳失敗: " + (data.error || "?"), false);
        }
      })
      .catch(() => showMsg("上傳失敗", false))
      .finally(hideLoading);
  };
  $("btnPrev").onclick = () => { if (currentPage > 1) loadPage(currentPage - 1); };
  $("btnNext").onclick = () => { if (currentPage < totalPages) loadPage(currentPage + 1); };
  $("btnAdd").onclick = addToCollection;
  $("btnExport").onclick = exportCollection;
}

async function openPdf(name){
  pdfName = name;
  currentPage = 1;
  totalPages = 0;
  collectionCount = 0;
  updateCollInfo();
  showPageNav(false);
  showLoading("分析 PDF 結構...");
  try {
    const res = await fetch("/api/pdf/" + encodeURIComponent(name));
    if (!res.ok){ showMsg("無法分析 " + name, false); return; }
    const data = await res.json();
    totalPages = data.pages.length;
    showPageNav(true);
    await loadPage(currentPage);
    showMsg("載入完成 (共 " + totalPages + " 頁)", true);
  } catch (e) {
    showMsg("載入失敗: " + e.message, false);
  } finally {
    hideLoading();
  }
}

async function loadPage(page){
  currentPage = page;
  showLoading("OCR 辨識第 " + page + " 頁...");
  try {
    const res = await fetch("/api/pdf/" + encodeURIComponent(pdfName) + "/" + page);
    if (!res.ok){ showMsg("無法載入第 " + page + " 頁", false); return; }
    analysisData = { pages: [await res.json()] };
    selections = { 0: new Set() };
    dups = {};
    $("pageInfo").textContent = page + " / " + totalPages;
    $("btnPrev").disabled = page <= 1;
    $("btnNext").disabled = page >= totalPages;
    $("btnAdd").style.display = "";
    buildMain();
    showMsg("第 " + page + " 頁載入完成", true);
  } catch (e) {
    showMsg("載入失敗: " + e.message, false);
  } finally {
    hideLoading();
  }
}

function showPageNav(show){
  $("pageNav").style.display = show ? "inline" : "none";
}

function updateCollInfo(){
  $("collInfo").textContent = "集合: " + collectionCount;
  $("collInfo").style.display = collectionCount > 0 ? "inline-block" : "none";
}

async function addToCollection(){
  const rows = collectRows();
  if (!rows.length){ showMsg("沒有選取任何列", false); return; }
  const pageData = analysisData.pages[0];
  const body = {
    pdf: pdfName,
    page: currentPage,
    date_iso: pageData.date_iso || '',
    date_roc: pageData.date_roc || '',
    date_disp: pageData.date_disp || '',
    type: pageData.type || '',
    rows: rows
  };
  showLoading("加入集合...");
  try {
    const res = await fetch("/api/collection", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const out = await res.json();
    if (out.ok){
      collectionCount = out.count;
      updateCollInfo();
      showMsg("已加入集合 (共 " + collectionCount + " 頁)", true);
    } else {
      showMsg("加入失敗: " + (out.error || "?"), false);
    }
  } catch (e) {
    showMsg("加入失敗", false);
  } finally {
    hideLoading();
  }
}

async function exportCollection(){
  showLoading("從集合匯出 CSV...");
  try {
    const res = await fetch("/api/collection");
    const coll = await res.json();
    if (!coll.items.length){ showMsg("集合為空，請先加入頁面", false); return; }
    const allRows = [];
    let date_iso = '', date_roc = '';
    coll.items.forEach(item => {
      date_iso = item.date_iso || date_iso;
      date_roc = item.date_roc || date_roc;
      item.rows.forEach(r => allRows.push(r));
    });
    const body = {
      pdf: pdfName,
      date_iso: date_iso,
      date_roc: date_roc,
      rows: allRows
    };
    const expRes = await fetch("/export", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const out = await expRes.json();
    if (out.ok){
      showMsg("已匯出 " + out.path + " (" + out.rows + " 列, " + coll.count + " 頁)", true);
    } else {
      showMsg("匯出失敗: " + (out.error || "?"), false);
    }
  } catch (e) {
    showMsg("匯出失敗", false);
  } finally {
    hideLoading();
  }
}

function buildMain(){
  const main = $("main");
  main.innerHTML = "";
  if (!analysisData.pages.length) return;
  const p = analysisData.pages[0];
  const i = 0;

  const pageEl = document.createElement("section");
  pageEl.className = "page";
  pageEl.id = "page-" + i;

  const head = document.createElement("div");
  head.className = "page-head";
  const h3 = document.createElement("h3");
  h3.textContent = "第 " + currentPage + " 頁";
  head.appendChild(h3);
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = p.type;
  head.appendChild(badge);
  const lbl = document.createElement("span");
  lbl.textContent = "時段:";
  head.appendChild(lbl);
  const sel = document.createElement("select");
  sel.dataset.page = i;
  ["上午","下午"].forEach(s => {
    const o = document.createElement("option");
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
  if (p.shift) sel.value = p.shift;
  sel.onchange = () => updateAutoColumn(i, "時段", sel.value);
  head.appendChild(sel);
  const info = document.createElement("span");
  info.style.color = "#666";
  info.textContent = p.shift ? ("偵測:" + p.shift + " (可靠度 " + p.shift_conf + ")") : "時段未偵測";
  head.appendChild(info);
  if (p.auto_fields && Object.keys(p.auto_fields).length > 0) {
    const ocrBadge = document.createElement("span");
    ocrBadge.className = "badge";
    ocrBadge.style.background = "#34a853";
    ocrBadge.textContent = "OCR 預填";
    head.appendChild(ocrBadge);
  }
  const addBtn = document.createElement("button");
  addBtn.textContent = "+ 新增列";
  addBtn.onclick = () => addRow(i);
  head.appendChild(addBtn);
  const selAll = document.createElement("button");
  selAll.textContent = "全選";
  selAll.onclick = () => { analysisData.pages[i].rows.forEach((_, k) => selections[i].add(k)); syncPage(i); buildTable(); };
  head.appendChild(selAll);
  const selNone = document.createElement("button");
  selNone.textContent = "全不選";
  selNone.onclick = () => { selections[i].clear(); syncPage(i); buildTable(); };
  head.appendChild(selNone);
  pageEl.appendChild(head);

    const body = document.createElement("div");
    body.className = "page-body";

    const scanCol = document.createElement("div");
    scanCol.className = "scan-col";
    const canvas = document.createElement("canvas");
    canvas.width = 1653; canvas.height = p.size[1];
    canvas.dataset.page = i;
    scanCol.appendChild(canvas);

    const chips = document.createElement("div");
    chips.className = "chips";
    chips.id = "chips-" + i;
    scanCol.appendChild(chips);

    body.appendChild(scanCol);

    const tableCol = document.createElement("div");
    tableCol.className = "table-col";
    tableCol.id = "table-col-" + i;
    body.appendChild(tableCol);

    pageEl.appendChild(body);
    main.appendChild(pageEl);

    drawPage(i, canvas, chips);
    buildChips(i, chips);
    buildTable();
  }

function drawPage(i, canvas, chips){
  const p = analysisData.pages[i];
  const img = new Image();
  pageImages[i] = img;
  canvas.onclick = (ev) => {
    const rect = canvas.getBoundingClientRect();
    const sx = parseFloat(canvas.dataset.scale);
    const y = (ev.clientY - rect.top) * (canvas.height / rect.height) / sx;
    let hit = -1;
    bandRects(i).forEach(b => {
      if (y >= b.y0 && y < b.y1) hit = b.k;
    });
    if (hit >= 0) toggleRow(i, hit);
  };
  img.onload = () => {
    const ctx = canvas.getContext("2d");
    const sx = canvas.width / img.width;
    canvas.height = Math.round(img.height * sx);
    canvas.dataset.scale = sx;
    drawBands(i, canvas);
  };
  img.src = "/img/" + encodeURIComponent(pdfName) + "/" + p.page;
}

function bandRects(i){
  const p = analysisData.pages[i];
  const bands = [];
  p.rows.forEach((b, k) => bands.push({k, y0: b[0], y1: b[1]}));
  const hs = p.rows.map(b => b[1] - b[0]).sort((a, b) => a - b);
  const medH = hs.length ? hs[Math.floor(hs.length / 2)] : 60;
  const lastY1 = p.rows.length ? p.rows[p.rows.length - 1][1] : 0;
  const top = [...selections[i]].reduce((m, k) => Math.max(m, k), p.rows.length - 1);
  for (let k = p.rows.length; k <= top; k++){
    bands.push({k, y0: lastY1 + (k - p.rows.length) * medH, y1: lastY1 + (k - p.rows.length + 1) * medH});
  }
  return bands;
}

function drawBands(i, canvas){
  const ctx = canvas.getContext("2d");
  const sx = parseFloat(canvas.dataset.scale);
  const img = pageImages[i];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  bandRects(i).forEach(b => {
    const y = b.y0 * sx, h = (b.y1 - b.y0) * sx;
    const on = selections[i].has(b.k);
    ctx.fillStyle = on ? "rgba(66,133,244,.18)" : "rgba(0,0,0,.05)";
    ctx.fillRect(0, y, canvas.width, h);
    ctx.strokeStyle = on ? "#4285f4" : "#aaa";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(0, y, canvas.width, h);
    ctx.fillStyle = on ? "#fff" : "#666";
    ctx.fillRect(6, y + 3, 34, 16);
    ctx.fillStyle = on ? "#4285f4" : "#666";
    ctx.font = "11px sans-serif";
    ctx.fillText((b.k + 1) + "番", 9, y + 15);
  });
}

function buildChips(i, chips){
  const p = analysisData.pages[i];
  chips.innerHTML = "";
  p.rows.forEach((band, k) => {
    const c = document.createElement("div");
    c.className = "chip";
    c.textContent = k + 1;
    c.dataset.k = k;
    c.onclick = () => toggleRow(i, k);
    chips.appendChild(c);
  });
}

function toggleRow(i, k){
  const set = selections[i];
  if (set.has(k)) set.delete(k); else set.add(k);
  syncPage(i);
  buildTable();
}

function syncPage(i){
  const canvas = document.querySelector('canvas[data-page="' + i + '"]');
  const chips = $("chips-" + i);
  chips.querySelectorAll(".chip").forEach(ch => {
    ch.classList.toggle("on", selections[i].has(parseInt(ch.dataset.k)));
  });
  if (canvas) drawBands(i, canvas);
}

function addRow(i){
  const p = analysisData.pages[i];
  const k = p.rows.length;
  if (!selections[i].has(k)){
    selections[i].add(k);
  }
  const chips = $("chips-" + i);
  const c = document.createElement("div");
  c.className = "chip on";
  c.textContent = "＋" + (k + 1);
  c.dataset.k = k;
  c.onclick = () => toggleRow(i, k);
  chips.appendChild(c);
  buildTable();
}

function updateAutoColumn(i, col, value){
  // 更新該頁所有列的自動欄(時段)
  const table = document.querySelector("table.grid");
  if (!table) return;
  table.querySelectorAll('tr[data-page="' + i + '"]').forEach(tr => {
    const inp = tr.querySelector('input[name="' + col + '"]');
    if (inp) inp.value = value;
  });
}

function buildTable(){
  showLoading("載入表格...");
  try {
  const old = document.querySelector(".table-wrap");
  if (old) old.remove();

  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const table = document.createElement("table");
  table.className = "grid";

  // 決定列順序:所有被選取列(依頁、依 band),重複列跟在其後
  const items = [];
  analysisData.pages.forEach((p, i) => {
    [...selections[i]].sort((a, b) => a - b).forEach(k => {
      items.push({page: i, band: k, bandNo: k + 1, dup: 0});
      for (let d = 1; d <= (dups[i + ":" + k] || 0); d++)
        items.push({page: i, band: k, bandNo: k + 1, dup: d});
    });
  });

  // thead: group 列 + 欄名列
  const thead = document.createElement("thead");
  const grpRow = document.createElement("tr");
  grpRow.className = "group";
  const autoLabel = document.createElement("th");
  autoLabel.colSpan = AUTOS.length;
  autoLabel.textContent = "自動";
  grpRow.appendChild(autoLabel);
  GROUPS.forEach(g => {
    const th = document.createElement("th");
    th.colSpan = g.cols.length;
    th.textContent = g.label;
    grpRow.appendChild(th);
  });
  const thCopy = document.createElement("th");
  thCopy.textContent = "";
  grpRow.appendChild(thCopy);
  thead.appendChild(grpRow);

  const colRow = document.createElement("tr");
  colRow.className = "cols";
  AUTOS.forEach(c => { const th = document.createElement("th"); th.textContent = c; colRow.appendChild(th); });
  GROUPS.forEach(g => g.cols.forEach(c => {
    const th = document.createElement("th"); th.textContent = c; colRow.appendChild(th);
  }));
  const thCopy2 = document.createElement("th"); thCopy2.textContent = "操作"; colRow.appendChild(thCopy2);
  thead.appendChild(colRow);
  table.appendChild(thead);

  // tbody
  const tbody = document.createElement("tbody");
  items.forEach((it, idx) => {
    const p = analysisData.pages[it.page];
    const tr = document.createElement("tr");
    tr.dataset.page = it.page;
    tr.dataset.band = it.band;
    tr.dataset.dup = it.dup;

    // 自動欄
    const autoVals = {
      日期: analysisData.date_iso,
      類型: p.type,
      番數: it.bandNo,
      時段: shiftValue(it.page)
    };
    AUTOS.forEach(c => {
      const td = document.createElement("td");
      td.className = "auto";
      const inp = document.createElement("input");
      inp.name = c;
      inp.value = autoVals[c];
      if (c !== "番數") inp.readOnly = true;
      inp.style.width = c === "日期" ? "90px" : "48px";
      td.appendChild(inp);
      tr.appendChild(td);
    });

    // 群組欄
    GROUPS.forEach(g => g.cols.forEach(c => {
      const td = document.createElement("td");
      const inp = document.createElement("input");
      inp.name = c;
      // Pre-fill from OCR auto_fields if available
      const bandFields = p.auto_fields && p.auto_fields[it.band];
      if (bandFields) {
        const val = mapField(c, bandFields);
        if (val !== undefined && val !== '' && val !== null) {
          inp.value = val;
          inp.classList.add("auto-fill");
        }
      }
      td.appendChild(inp);
      tr.appendChild(td);
    }));

    // 排列:無 OCR 圈選值時自動帶入轉位;OCR 圈選與轉位不符時標黃警告
    // 中型 3 個模具: 排列1,2,4 ← 轉位1,2,3 (排列3 留空); 4 個模具: 排列1~4 ← 轉位1~4
    const bandFields2 = p.auto_fields && p.auto_fields[it.band];
    let moldCount = 0;
    for (let m = 1; m <= 6; m++){
      const z = tr.querySelector('input[name="轉位' + m + '"]');
      if (z && z.value) moldCount++;
    }
    GROUPS.forEach(g => {
      if (g.label !== "排列") return;
      g.cols.forEach((c, k) => {
        const pai = tr.querySelector('input[name="' + c + '"]');
        if (!pai) return;
        let src = k;                      // 預設 排列(k+1) ← 轉位(k+1)
        if (p.type === "中型" && moldCount === 3){
          if (k === 2) src = -1;          // 排列3 留空
          else if (k === 3) src = 2;      // 排列4 ← 轉位3
          else if (k >= 4) src = -1;      // 排列5/6 留空
        }
        const zhuan = src >= 0 ? tr.querySelector('input[name="轉位' + (src + 1) + '"]') : null;
        if (!pai.value && zhuan && zhuan.value) {
          pai.value = zhuan.value;
          pai.classList.add("auto-fill");
        }
        if (bandFields2 && bandFields2.arrange_conflict){
          pai.classList.add("auto-warn");
          pai.title = "OCR 排列順序與轉位不符,請人工確認";
        }
      });
    });

    // 生產數量(支數) = 品項對照(支/模具) × 模具個數;對照為 0 或無對照時留空人工輸入
    const fillQuantity = (r) => {
      const q = r.querySelector('input[name="生產數量(支數)"]');
      const it = r.querySelector('input[name="品項"]');
      if (!q || !it) return;
      if (q.value) return;
      const per = ITEM_COUNT[(it.value || "").trim()];
      if (!per) return;
      let n = 0;
      for (let m = 1; m <= 6; m++){
        const z = r.querySelector('input[name="轉位' + m + '"]');
        if (z && z.value) n++;
      }
      if (n > 0){
        q.value = per * n;
        q.classList.add("auto-fill");
      }
    };
    fillQuantity(tr);
    const itemInp = tr.querySelector('input[name="品項"]');
    if (itemInp) itemInp.addEventListener("input", () => fillQuantity(tr));
    for (let m = 1; m <= 6; m++){
      const z = tr.querySelector('input[name="轉位' + m + '"]');
      if (z) z.addEventListener("input", () => fillQuantity(tr));
    }

    // 操作
    const td = document.createElement("td");
    td.className = "copytd";
    const btn = document.createElement("button");
    btn.textContent = "複製上列";
    btn.title = "把上一列的值複製到這列";
    btn.onclick = () => copyFromPrev(tr, tbody.children[idx - 1]);
    td.appendChild(btn);
    const dupBtn = document.createElement("button");
    dupBtn.textContent = "＋重複";
    dupBtn.title = "同番次新增一列(同一番次多序時使用)";
    dupBtn.onclick = () => {
      const key = it.page + ":" + it.band;
      dups[key] = (dups[key] || 0) + 1;
      buildTable();
    };
    td.appendChild(dupBtn);
    tr.appendChild(td);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  const col = $("table-col-0");
  if (col) {
    col.innerHTML = "";
    col.appendChild(wrap);
  }
} finally {
  hideLoading();
}
}

function shiftValue(p){
  const sel = document.querySelector('select[data-page="' + p + '"]');
  return sel ? sel.value : "下午";
}

function mapField(csvCol, bandFields){
  if (!bandFields) return undefined;
  switch (csvCol) {
    case "品項": return bandFields.item || undefined;
    case "轉位1": return bandFields.molds[0] || undefined;
    case "轉位2": return bandFields.molds[1] || undefined;
    case "轉位3": return bandFields.molds[2] || undefined;
    case "轉位4": return bandFields.molds[3] || undefined;
    case "轉位5": return bandFields.molds[4] || undefined;
    case "轉位6": return bandFields.molds[5] || undefined;
    case "離心開始": return bandFields.centrifuge[0] || undefined;
    case "離心結束": return bandFields.centrifuge[1] || undefined;
    case "加料轉速": return bandFields.speeds[0] || undefined;
    case "慢速轉速": return bandFields.speeds[1] || undefined;
    case "中速轉速": return bandFields.speeds[2] || undefined;
    case "高速轉速": return bandFields.speeds[3] || undefined;
    case "加料時間": return bandFields.speed_times[0] || undefined;
    case "慢速時間": return bandFields.speed_times[1] || undefined;
    case "中速時間": return bandFields.speed_times[2] || undefined;
    case "高速時間": return bandFields.speed_times[3] || undefined;
    case "蒸養池": return bandFields.steam_pool || undefined;
    case "蒸養溫度1": return bandFields.c14 && bandFields.c14[0];
    case "蒸養溫度2": return bandFields.c14 && bandFields.c14[1];
    case "蒸養溫度3": return bandFields.c14 && bandFields.c14[2];
    case "蒸養階段1": return bandFields.c15 && bandFields.c15[0];
    case "蒸養階段2": return bandFields.c15 && bandFields.c15[1];
    case "蒸養階段3": return bandFields.c15 && bandFields.c15[2];
    case "排列1": return bandFields.arrange ? bandFields.arrange[0] : undefined;
    case "排列2": return bandFields.arrange ? bandFields.arrange[1] : undefined;
    case "排列3": return bandFields.arrange ? bandFields.arrange[2] : undefined;
    case "排列4": return bandFields.arrange ? bandFields.arrange[3] : undefined;
    case "排列5": return bandFields.arrange ? bandFields.arrange[4] : undefined;
    case "排列6": return bandFields.arrange ? bandFields.arrange[5] : undefined;
    default: return undefined;
  }
}

function copyFromPrev(tr, prev){
  if (!prev) return;
  tr.querySelectorAll("input").forEach(inp => {
    if (inp.readOnly) return;
    const pv = prev.querySelector('input[name="' + inp.name + '"]');
    if (pv && pv.value) inp.value = pv.value;
  });
}

function collectRows(){
  const rows = [];
  analysisData.pages.forEach((p, i) => {
    [...selections[i]].sort((a, b) => a - b).forEach(k => {
      const n = 1 + (dups[i + ":" + k] || 0);
      for (let d = 0; d < n; d++){
        const tr = document.querySelector('tr[data-page="' + i + '"][data-band="' + k + '"][data-dup="' + d + '"]');
        const row = {};
        if (tr){
          tr.querySelectorAll("input").forEach(inp => { row[inp.name] = inp.value; });
        }
        rows.push(row);
      }
    });
  });
  return rows;
}

async function exportCsv(){
  const rows = collectRows();
  if (!rows.length){ showMsg("沒有選取任何列", false); return; }
  const body = {
    pdf: pdfName,
    date_iso: analysisData.date_iso,
    date_roc: analysisData.date_roc,
    rows: rows
  };
  const res = await fetch("/export", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  const out = await res.json();
  if (out.ok){
    showMsg("已匯出 " + out.path + " (" + out.rows + " 列)", true);
  } else {
    showMsg("匯出失敗: " + (out.error || "?"), false);
  }
}

$("btnExport").onclick = exportCsv;
loadPdfs();
</script>
</body>
